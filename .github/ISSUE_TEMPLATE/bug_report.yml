name: Bug report
description: Report something broken or behaving incorrectly
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear summary of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Booking flow
        - Scheduling / availability
        - Admin dashboard
        - Shop configuration
        - Theme / design system
        - PWA / mobile
        - SEO
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Chrome 140 on Windows 11, or iOS Safari on iPhone 15
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Screenshots or logs
      description: Attach anything that helps explain the problem.
    validations:
      required: false
