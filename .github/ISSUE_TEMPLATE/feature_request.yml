name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to achieve? What is missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen? Keep it concrete.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Booking flow
        - Scheduling / availability
        - Admin dashboard
        - Shop configuration
        - Theme / design system
        - PWA / mobile
        - SEO
        - Other
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: The plan keeps payments, memberships, loyalty, and inventory out of scope for now.
      options:
        - label: This fits the current project scope
          required: false
