services:
  db:
    image: postgres:17-alpine
    container_name: grooma-db
    environment:
      POSTGRES_USER: grooma
      POSTGRES_PASSWORD: grooma
      POSTGRES_DB: grooma
    ports:
      - "5432:5432"
    volumes:
      - grooma-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grooma -d grooma"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  grooma-db-data:
